<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        a {
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔗 URL Shortener</h1>

        <p>Enter your long URL and create a short URL</p>

        <form action="/shorten" method="POST">

            <input
                type="url"
                name="url"
                placeholder="https://example.com"
                required
            >

            <br>

            <button type="submit">
                Shorten URL
            </button>

        </form>

        {% if short_url %}

        <div class="result">

            <h3>Your Short URL</h3>

            <a href="{{ short_url }}" target="_blank">
                {{ short_url }}
            </a>

        </div>

        {% endif %}

    </div>

</body>
</html>
